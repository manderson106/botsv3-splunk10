# Competitor role: inherits the scoreboard's locked-down ctf_competitor role.
[role_bots_player]
importRoles = ctf_competitor
srchIndexesAllowed = botsv3;scoreboard
srchIndexesDefault = botsv3
srchJobsQuota = 6
srchDiskQuota = 500
srchMaxTime = 5m
mcp_tool_execute = enabled

# Allow users to authenticate with tokens (needed for MCP clients).
[tokens_auth]
disabled = 0
